---
- name : setup build-agent
  hosts: build
  become: yes

  tasks:
    - name: Install java
      apt:
        name: openjdk-21-jdk
        state: present
        update_cache: yes

    - name: Install Jenkins
      shell: |
        wget -q -O /usr/share/keyrings/jenkins-keyring.asc https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" | tee /etc/apt/sources.list.d/jenkins.list
        apt-get update
        apt-get install -y jenkins

    - name: Start Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Install docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes